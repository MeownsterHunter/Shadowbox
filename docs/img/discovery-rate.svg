<text x="592.9" y="261.0" fill="#8b949e" font-size="12" font-weight="600">7.3 x 10^12</text>
<text x="290" y="301.0" fill="#8b949e" font-size="12" text-anchor="end">3d. Refined pass 2, modifier sets</text>
<rect x="300" y="284" width="136.4" height="26" rx="4" fill="#2a78d6"/>
<text x="444.4" y="301.0" fill="#8b949e" font-size="12" font-weight="600">1,438,992</text>
<text x="0" y="340" fill="#8b949e" font-size="11">1: distinct failures in one game harvest (3 in 45 min of play); investigation time excluded.</text>
<text x="0" y="358" fill="#8b949e" font-size="11">2: words nvdisasm decodes and Shadowbox calls Unknown, per hour of sweep run time.</text>
<text x="0" y="376" fill="#8b949e" font-size="11">3: encodings accounted for by layouts of rows whose composed words were >= 90% exact: pass 1 194 rows in 25 min,</text>
<text x="0" y="394" fill="#8b949e" font-size="11">   pass 2 209 rows in 52 min (both passes). 3a/3c count immediates, 3b/3d only modifier, enum and flag</text>
<text x="0" y="412" fill="#8b949e" font-size="11">   fields, summed over operand forms; registers, don't-care and form bits are never counted.</text>
<text x="0" y="430" fill="#8b949e" font-size="11">   Gaps (1, 2) and encodings (3) are different units; run times exclude investigation.</text>
</svg>
