<text x="321.3" y="61.0" fill="#8b949e" font-size="12" font-weight="600">4</text>
<text x="290" y="101.0" fill="#8b949e" font-size="12" text-anchor="end">2a. Oracle sweep, opcode space</text>
<rect x="300" y="84" width="124.6" height="26" rx="4" fill="#2a78d6"/>
<text x="432.6" y="101.0" fill="#8b949e" font-size="12" font-weight="600">424,074</text>
<text x="290" y="141.0" fill="#8b949e" font-size="12" text-anchor="end">2b. Oracle sweep, all rows</text>
