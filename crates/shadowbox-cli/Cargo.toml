[package]
name = "shadowbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shadowbox"
path = "src/main.rs"

[dependencies]
ash = "0.38"
libc = "0.2"
shadowbox = { path = "../shadowbox" }
sha2 = "0.10"
flate2 = "1"
brotli = "8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
sha1 = "0.10"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
lzma-rs = "0.3"
aes = { version = "0.8", features = ["zeroize"] }
ecb = "0.1"
zeroize = "1"

[dev-dependencies]
getrandom = "0.4"
